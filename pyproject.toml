[project]
name = "recall"
version = "0.1.0"
description = "Everything 找文件名，Recall 找记忆。本机、即时、可问答的第二大脑。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24.9,<2",
    "watchdog>=4.0",
    "jieba>=0.42.1",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
recall = "recall.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
